[package]
name = "hashcheck-rs"
version = "0.1.0"
edition = "2021"
description = "File integrity manifests, verification and duplicate finder using SHA-256"
license = "MIT"
repository = "https://github.com/jvch0512/hashcheck-rs"

[[bin]]
name = "hashcheck"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
